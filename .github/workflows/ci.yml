name: CI

# Build + validate on pull requests and non-main pushes so a broken page or
# missing metadata is caught before it reaches the deploy workflow on main.
on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

# Keep these in sync with deploy.yml. wasm-bindgen MUST match the wasm-bindgen
# crate version in Cargo.lock; bump both together.
env:
  WASM_BINDGEN_VERSION: "0.2.122"
  TAILWIND_VERSION: "v4.3.0"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-bindgen-cli
        run: |
          set -euo pipefail
          url="https://github.com/rustwasm/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}/wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -sSL "$url" | tar xz -C /tmp
          sudo install "/tmp/wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl/wasm-bindgen" /usr/local/bin/

      - name: Install Tailwind CSS
        run: |
          set -euo pipefail
          url="https://github.com/tailwindlabs/tailwindcss/releases/download/${TAILWIND_VERSION}/tailwindcss-linux-x64"
          sudo curl -sSL -o /usr/local/bin/tailwindcss "$url"
          sudo chmod +x /usr/local/bin/tailwindcss

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Unit tests
        run: cargo test -p site -p build-site -p tools --features site/ssr

      - name: Build static site
        run: make build

      - name: Validate build
        run: make validate
